[package]
name = "lychee-vms"
version = "2025.3.0"
edition = "2021"
authors = ["LycheeVMS Core Team"]
description = "Native Enterprise Video Management & Smart Client Studio in Pure Rust"

[dependencies]
lychee_common = { path = "../crates/lychee_common" }
lychee_database = { path = "../crates/lychee_database" }
lychee_identity = { path = "../crates/lychee_identity" }
lychee_management = { path = "../crates/lychee_management" }
lychee_platform = { path = "../crates/lychee_platform" }
lychee_events = { path = "../crates/lychee_events" }
lychee_mobile = { path = "../crates/lychee_mobile" }
lychee_analytics = { path = "../crates/lychee_analytics" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
